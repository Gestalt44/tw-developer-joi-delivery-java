spring:
  h2:
    console:
      enabled: true
  application:
    name: delivery
  datasource:
    url: jdbc:h2:mem:joidelivery
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
logging:
    level:
      org.springframework.web: DEBUG
